<style>body{margin:0;background:#e9e9ea;font-family:"Barlow",system-ui,sans-serif}a{color:#5980a6}</style>
</helmet>
<div style="padding:34px 30px;display:flex;flex-direction:column;gap:10px">
  <h4 style="margin:0">Assistant tab icon — pick one</h4>
  <p style="margin:0 0 14px;font-size:12.5px;color:rgba(0,0,0,.55);max-width:520px">Each row shows the glyph selected (solid) then unselected (outline), at real tab-bar size, on both themes.</p>
  <sc-for list="{{opts}}" as="o" hint-placeholder-count="5">
    <div style="display:flex;align-items:center;gap:20px;background:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 1px 3px rgba(29,31,32,.08)">
      <div style="width:118px">
        <div style="font-family:var(--font-heading);font-weight:600;font-size:15px">{{o.id}} · {{o.name}}</div>
        <div style="font-size:11px;color:rgba(0,0,0,.5)">{{o.note}}</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;background:#f4f4f6;border-radius:12px;padding:8px 16px">
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--color-accent-600)">
          <svg width="25" height="25" viewBox="0 0 24 24" fill="currentColor" style="display:block"><path d="{{o.on}}"></path></svg>
          <span style="font-size:10px;font-weight:600">Assistant</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--color-neutral-500)">
          <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="{{o.off}}"></path></svg>
          <span style="font-size:10px">Assistant</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;background:#16273a;border-radius:12px;padding:8px 16px">
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#7ba5cd">
          <svg width="25" height="25" viewBox="0 0 24 24" fill="currentColor" style="display:block"><path d="{{o.on}}"></path></svg>
          <span style="font-size:10px;font-weight:600">Assistant</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#6d89a8">
          <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="{{o.off}}"></path></svg>
          <span style="font-size:10px">Assistant</span>
        </div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
